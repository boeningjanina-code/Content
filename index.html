<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content-Kalender</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Content">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fde4ee">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: one-screen phone app. Glass month grid (swipe) on top, day list below, floating + opens a bottom sheet. */
:root{
  --bg:#fde4ee; --bg2:#f9c9dd; --blob1:#ff9ec4; --blob2:#ffc6a8; --blob3:#e7b3ff;
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.68); --glass-line:rgba(255,255,255,.85);
  --fg:#4a2236; --muted:#9a6a82; --accent:#e8508f; --accent-deep:#c43474; --accent-soft:rgba(232,80,143,.14);
  --shadow:rgba(196,52,116,.22); --orange:#f08a2b; --green:#26a866; --danger:#d23c5a;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1220; --bg2:#3a1730; --blob1:#a3306a; --blob2:#7a3a4a; --blob3:#5c2f7d;
  --glass:rgba(255,255,255,.08); --glass-strong:rgba(60,24,46,.86); --glass-line:rgba(255,190,220,.22);
  --fg:#fde8f1; --muted:#c996b0; --accent:#ff6fa8; --accent-deep:#ff8fbc; --accent-soft:rgba(255,111,168,.18);
  --shadow:rgba(0,0,0,.45); --orange:#ffa04d; --green:#4fd38c; --danger:#ff7088; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1220; --bg2:#3a1730; --blob1:#a3306a; --blob2:#7a3a4a; --blob3:#5c2f7d;
  --glass:rgba(255,255,255,.08); --glass-strong:rgba(60,24,46,.86); --glass-line:rgba(255,190,220,.22);
  --fg:#fde8f1; --muted:#c996b0; --accent:#ff6fa8; --accent-deep:#ff8fbc; --accent-soft:rgba(255,111,168,.18);
  --shadow:rgba(0,0,0,.45); --orange:#ffa04d; --green:#4fd38c; --danger:#ff7088; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);color:var(--fg);background:linear-gradient(160deg,var(--bg),var(--bg2));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
.blobs i:nth-child(1){width:320px;height:320px;background:var(--blob1);top:-90px;left:-80px}
.blobs i:nth-child(2){width:260px;height:260px;background:var(--blob2);top:42%;right:-110px}
.blobs i:nth-child(3){width:300px;height:300px;background:var(--blob3);bottom:-120px;left:10%}

.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 14px 34px -14px var(--shadow),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(232,80,143,.06)}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.brand{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.month{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.month small{font-weight:500;color:var(--muted);font-size:1.1rem;margin-left:4px}
.nav{display:flex;gap:8px;flex-shrink:0}
.btn-round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--fg);font:inherit;border:1px solid var(--glass-line)}
.btn-round svg{width:18px;height:18px}
.btn-pill{height:42px;padding:0 14px;border-radius:21px;font:700 .85rem var(--f-body);color:var(--accent-deep);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.day:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.cal{border-radius:28px;padding:12px 8px 10px;touch-action:pan-y;overflow:hidden}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.wd span{text-align:center;font:700 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wd span:nth-child(n+6){color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.grid.out-l{transform:translateX(-28%);opacity:0;transition:none}
.grid.out-r{transform:translateX(28%);opacity:0;transition:none}
.day{min-width:0;min-height:76px;border-radius:14px;padding:5px 3px 4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;
  background:rgba(255,255,255,.22);border:1px solid transparent;text-align:left;font:inherit;color:inherit;transition:transform .15s,background .15s}
.day:active{transform:scale(.95)}
.day.other{opacity:.38}
.num{font:600 .82rem var(--f-display);padding-left:3px;font-variant-numeric:tabular-nums;line-height:1.3}
.day.today .num{display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 4px 10px -3px var(--accent)}
.day.sel{background:var(--glass-strong);border-color:var(--glass-line);box-shadow:0 8px 18px -8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
.chip{display:flex;align-items:center;gap:3px;min-width:0;font-size:.6rem;font-weight:700;line-height:1.25}
.chip b{width:6px;height:6px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot-bearbeitung{background:var(--orange)}
.dot-veroeffentlicht{background:var(--green)}
.more{font-size:.58rem;font-weight:800;color:var(--muted);padding-left:3px}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:0 6px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend{display:flex;gap:12px}
.legend span{display:flex;align-items:center;gap:5px;font-weight:700}
.legend b{width:8px;height:8px;border-radius:50%}

.daypanel{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 4px 0}
.dayhead h2{font:600 1.15rem var(--f-display);margin:0}
.dayhead span{font-size:.8rem;color:var(--muted);font-weight:700}
.post{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.post:active{transform:scale(.98)}
.post-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.post h3{margin:0;font:600 1.02rem var(--f-display);min-width:0;overflow-wrap:anywhere}
.post p{margin:0;font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.badge{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px}
.badge.bearbeitung{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.badge.veroeffentlicht{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.badge b{width:7px;height:7px;border-radius:50%}
.empty{border-radius:22px;padding:22px 18px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.5}
.empty strong{display:block;color:var(--fg);font:600 1rem var(--f-display);margin-bottom:2px}
.status-line{font-size:.75rem;color:var(--muted);text-align:center;min-height:1em}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:grid;place-items:center;z-index:20;
  background:radial-gradient(circle at 32% 28%,#ffb3d1 0%,var(--accent) 45%,var(--accent-deep) 100%);
  box-shadow:0 16px 30px -10px var(--accent-deep),inset 0 2px 3px rgba(255,255,255,.6),inset 0 -4px 8px rgba(120,0,50,.25);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

.scrim{position:fixed;inset:0;background:rgba(60,10,35,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;border-radius:30px 30px 0 0;
  background:var(--glass-strong);border:1px solid var(--glass-line);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:0 -20px 50px -20px var(--shadow);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.4;margin:0 auto}
.sheet h2{margin:0;font:700 1.35rem var(--f-display)}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lbl{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;font:600 1rem var(--f-body);color:var(--fg);padding:13px 15px;border-radius:16px;border:1px solid var(--glass-line);
  background:rgba(255,255,255,.4);box-shadow:inset 0 2px 5px rgba(196,52,116,.08)}
:root[data-theme="dark"] .input{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .input{background:rgba(255,255,255,.06)}}
.input::placeholder{color:var(--muted);opacity:.75;font-weight:400}
textarea.input{min-height:140px;resize:vertical;line-height:1.5;font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:var(--accent-soft)}
.seg button{border:none;border-radius:14px;padding:11px 6px;font:800 .85rem var(--f-body);color:var(--muted);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button b{width:8px;height:8px;border-radius:50%}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:0 6px 14px -8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
.textrow{display:flex;justify-content:space-between;align-items:center}
.ghost{border:none;background:transparent;color:var(--accent-deep);font:800 .8rem var(--f-body);cursor:pointer;padding:4px 6px;border-radius:8px}
.actions{display:flex;gap:10px;align-items:center}
.primary{flex:1;height:54px;border:none;border-radius:27px;color:#fff;font:700 1.05rem var(--f-display);cursor:pointer;
  background:linear-gradient(145deg,var(--accent),var(--accent-deep));box-shadow:0 12px 24px -10px var(--accent-deep),inset 0 1px 1px rgba(255,255,255,.5)}
.primary:disabled{opacity:.5}
.del{height:54px;padding:0 18px;border-radius:27px;border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);background:transparent;color:var(--danger);font:800 .85rem var(--f-body);cursor:pointer}
.del.armed{background:var(--danger);color:#fff}
.backup{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.backup label{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);opacity:0;z-index:40;
  padding:10px 18px;border-radius:99px;font-weight:800;font-size:.85rem;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.day{min-height:66px}.chip{font-size:.55rem}.month{font-size:1.5rem}}
</style>
</head>
<body>

<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <header>
    <div>
      <div class="brand">Content-Kalender</div>
      <h1 class="month" id="monthTitle">November <small>2026</small></h1>
    </div>
    <div class="nav">
      <button class="btn-round glass" id="prev" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn-pill glass" id="todayBtn">Heute</button>
      <button class="btn-round glass" id="next" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </header>

  <section class="cal glass" id="cal" aria-label="Monatskalender">
    <div class="wd"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
    <div class="grid" id="grid"></div>
    <div class="hint">
      <div class="legend"><span><b class="dot-bearbeitung"></b>In Bearbeitung</span><span><b class="dot-veroeffentlicht"></b>Veröffentlicht</span></div>
      <span>← wischen →</span>
    </div>
  </section>

  <section class="daypanel" aria-live="polite">
    <div class="dayhead"><h2 id="dayTitle">Heute</h2><span id="dayCount"></span></div>
    <div id="dayList" class="daypanel"></div>
  </section>
  <div class="status-line" id="statusLine"></div>
  <div class="backup">
    <button type="button" class="ghost" id="exportBtn">Sicherung speichern</button>
    <label class="ghost" for="importFile">Sicherung laden</label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<button class="fab" id="fab" aria-label="Neuen Post anlegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="sheet-in" id="form" autocomplete="off">
    <div class="grab"></div>
    <h2 id="sheetTitle">Neuer Post</h2>
    <div class="field">
      <label for="fTitle">Idee</label>
      <input class="input" id="fTitle" required maxlength="140" placeholder="z. B. Vorher/Nachher Kanalreinigung Lörrach">
    </div>
    <div class="field">
      <span class="lbl" id="statusLbl">Status</span>
      <div class="seg" role="group" aria-labelledby="statusLbl">
        <button type="button" id="sBear" data-s="bearbeitung" aria-pressed="true"><b class="dot-bearbeitung"></b>In Bearbeitung</button>
        <button type="button" id="sVer" data-s="veroeffentlicht" aria-pressed="false"><b class="dot-veroeffentlicht"></b>Veröffentlicht</button>
      </div>
    </div>
    <div class="field">
      <label for="fDate">Datum</label>
      <input class="input" type="date" id="fDate" required>
    </div>
    <div class="field">
      <div class="textrow"><label for="fText">Beitragstext</label><button type="button" class="ghost" id="copyBtn">Text kopieren</button></div>
      <textarea class="input" id="fText" placeholder="Fertiger Text mit Zeilenumbrüchen und #Hashtags …"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="del" id="delBtn" hidden>Löschen</button>
      <button type="submit" class="primary" id="saveBtn">Speichern</button>
    </div>
  </form>
</div>
<div class="toast glass" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const pad=n=>String(n).padStart(2,"0");
  const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
  const today=new Date(); today.setHours(0,0,0,0);
  let view=new Date(today.getFullYear(),today.getMonth(),1);
  let selected=key(today);
  let posts=[]; let mode="loading"; let editingId=null; let status="bearbeitung";
  const LKEY="rosa-content-kalender";

  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function byDay(){const m={};for(const p of posts){if(!p.date)continue;(m[p.date]||(m[p.date]=[])).push(p)}
    for(const k in m)m[k].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));return m}

  function renderGrid(){
    $("monthTitle").innerHTML=MONTHS[view.getMonth()]+' <small>'+view.getFullYear()+'</small>';
    const map=byDay(); const first=new Date(view); const off=(first.getDay()+6)%7;
    const start=new Date(view.getFullYear(),view.getMonth(),1-off);
    const daysIn=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    const cells=Math.ceil((off+daysIn)/7)*7; let h="";
    for(let i=0;i<cells;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i); const k=key(d);
      const list=map[k]||[]; const cls=["day"];
      if(d.getMonth()!==view.getMonth())cls.push("other");
      if(k===key(today))cls.push("today"); if(k===selected)cls.push("sel");
      let chips=list.slice(0,2).map(p=>'<span class="chip"><b class="dot-'+p.status+'"></b><span>'+esc(p.title)+'</span></span>').join("");
      if(list.length>2)chips+='<span class="more">+'+(list.length-2)+'</span>';
      const label=d.getDate()+". "+MONTHS[d.getMonth()]+(list.length?", "+list.length+" Post"+(list.length>1?"s":""):"");
      h+='<button class="'+cls.join(" ")+'" data-k="'+k+'" aria-label="'+label+'"><span class="num">'+d.getDate()+'</span>'+chips+'</button>';
    }
    $("grid").innerHTML=h;
  }
  function renderDay(){
    const d=parseKey(selected); const list=byDay()[selected]||[];
    const isToday=selected===key(today);
    $("dayTitle").textContent=(isToday?"Heute, ":"")+d.toLocaleDateString("de-DE",{weekday:isToday?undefined:"long",day:"numeric",month:"long"});
    $("dayCount").textContent=list.length?list.length+(list.length===1?" Post":" Posts"):"";
    if(mode==="loading"){$("dayList").innerHTML='<div class="empty glass"><strong>Kalender wird geladen …</strong></div>';return}
    if(!list.length){$("dayList").innerHTML='<div class="empty glass"><strong>Noch nichts geplant</strong>Tipp auf das rosa Plus, um eine Idee für diesen Tag anzulegen.</div>';return}
    $("dayList").innerHTML=list.map(p=>'<button class="post glass" data-id="'+esc(p.id)+'"><div class="post-top"><h3>'+esc(p.title)+'</h3><span class="badge '+p.status+'"><b class="dot-'+p.status+'"></b>'+(p.status==="veroeffentlicht"?"Veröffentlicht":"In Bearbeitung")+'</span></div>'+(p.text?'<p>'+esc(p.text)+'</p>':'')+'</button>').join("");
  }
  function render(){renderGrid();renderDay()}

  function shift(dir){
    view=new Date(view.getFullYear(),view.getMonth()+dir,1);
    const g=$("grid"); g.classList.add(dir>0?"out-r":"out-l"); renderGrid();
    requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.remove("out-r","out-l")));
  }
  $("prev").onclick=()=>shift(-1); $("next").onclick=()=>shift(1);
  $("todayBtn").onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);selected=key(today);render()};
  $("grid").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;selected=b.dataset.k;
    const d=parseKey(selected); if(d.getMonth()!==view.getMonth()){shift(d<view?-1:1)} render();});
  let sx=0,sy=0,st=0;
  $("cal").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  $("cal").addEventListener("touchend",e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&Date.now()-st<700)shift(dx<0?1:-1)},{passive:true});
  $("dayList").addEventListener("click",e=>{const b=e.target.closest(".post");if(b)openSheet(posts.find(p=>p.id===b.dataset.id))});

  function setStatus(s){status=s;$("sBear").setAttribute("aria-pressed",s==="bearbeitung");$("sVer").setAttribute("aria-pressed",s==="veroeffentlicht")}
  $("sBear").onclick=()=>setStatus("bearbeitung"); $("sVer").onclick=()=>setStatus("veroeffentlicht");
  function openSheet(p){
    editingId=p?p.id:null;
    $("sheetTitle").textContent=p?"Post bearbeiten":"Neuer Post";
    $("fTitle").value=p?p.title:""; $("fDate").value=p?p.date:selected; $("fText").value=p?(p.text||""):"";
    setStatus(p?p.status:"bearbeitung");
    const del=$("delBtn"); del.hidden=!p; del.classList.remove("armed"); del.textContent="Löschen";
    $("scrim").hidden=false; requestAnimationFrame(()=>{$("scrim").classList.add("show");$("sheet").classList.add("show")});
    setTimeout(()=>{if(!p)$("fTitle").focus()},320);
  }
  function closeSheet(){$("scrim").classList.remove("show");$("sheet").classList.remove("show");setTimeout(()=>{$("scrim").hidden=true},260)}
  $("fab").onclick=()=>openSheet(null); $("scrim").onclick=closeSheet;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

  let tt; function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
  $("copyBtn").onclick=()=>{const txt=$("fText").value;if(!txt){toast("Noch kein Text zum Kopieren");return}
    try{navigator.clipboard.writeText(txt).then(()=>toast("Text kopiert"),()=>{$("fText").select();toast("Text markiert, jetzt kopieren")})}
    catch(_){$("fText").select();toast("Text markiert, jetzt kopieren")}};

  function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(posts))}catch(_){}}
  function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

  $("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const title=$("fTitle").value.trim(), date=$("fDate").value;
    if(!title||!date){toast(!title?"Bitte eine Idee eintragen":"Bitte ein Datum wählen");return}
    const old=editingId&&posts.find(p=>p.id===editingId);
    const obj={title,status,date,text:$("fText").value,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};
    const id=editingId||newId();
    $("saveBtn").disabled=true;
    try{
      posts=posts.filter(p=>p.id!==id).concat([{id,...obj}]);saveLocal();
      selected=date; const d=parseKey(date); view=new Date(d.getFullYear(),d.getMonth(),1);
      render(); closeSheet(); toast(old?"Änderung gespeichert":"Post angelegt");
    }catch(err){toast(err&&err.code==="quota_exceeded"?"Speicher voll, bitte alte Posts löschen":"Speichern hat nicht geklappt, bitte nochmal")}
    finally{$("saveBtn").disabled=false}
  });
  $("delBtn").onclick=async()=>{
    const b=$("delBtn"); if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Wirklich löschen?";return}
    try{ posts=posts.filter(p=>p.id!==editingId);saveLocal();
      render(); closeSheet(); toast("Post gelöscht") }catch(_){toast("Löschen hat nicht geklappt")}
  };

  function load(){try{posts=JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(_){posts=[]} mode="local"; render()}
  $("exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:"content-kalender",version:1,posts},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="content-kalender-sicherung-"+key(new Date())+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast("Sicherung erstellt");
  };
  $("importFile").onchange=e=>{
    const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{try{const data=JSON.parse(r.result); const list=Array.isArray(data)?data:data.posts;
      if(!Array.isArray(list))throw 0; const ids=new Set(posts.map(p=>p.id));
      let n=0; for(const p of list){if(p&&p.id&&p.title&&p.date&&!ids.has(p.id)){posts.push(p);n++}}
      saveLocal(); render(); toast(n+" Posts geladen")}catch(_){toast("Diese Datei ist keine Kalender-Sicherung")}
      e.target.value=""};
    r.readAsText(f);
  };
  load();
})();
</script>

</body>
</html>
